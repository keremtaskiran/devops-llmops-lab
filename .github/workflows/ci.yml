name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest


  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: devops-llmops-lab:ci

      - name: Inspect image
        run: docker image inspect devops-llmops-lab:ci

      - name: Run container
        run: |
          docker run -d --name devops-llmops-lab -p 8000:8000 devops-llmops-lab:ci

      - name: Test health endpoint
        run: |
          sleep 3
          curl --fail http://127.0.0.1:8000/health

      - name: Show container logs
        if: always()
        run: docker logs devops-llmops-lab


  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: devops-llmops-lab:ci

      - name: Check Docker image
        run: docker image inspect devops-llmops-lab:ci